[project]
name = "jarvis"
version = "0.8.0"
description = "Jarvis-voiced notification layer for Claude Code"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jobin" }]
dependencies = [
    "httpx>=0.27",
    "loguru>=0.7",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
# XTTS-v2 needs the PyTorch runtime. Kept optional so users on the
# ElevenLabs / `say` paths don't pull ~300MB they won't load.
#
# transformers is pinned <5 because coqui-tts 0.27.x still imports
# `isin_mps_friendly` from `transformers.pytorch_utils`, which was
# removed in transformers 5.0. Upstream coqui-tts has not adapted yet.
xtts = [
    "coqui-tts[codec]>=0.24",
    "torch>=2.2",
    "torchaudio>=2.2",
    "transformers>=4.57,<5",
    # XTTS's tokenizer transliterates Chinese via pypinyin; without it the
    # zh-cn path raises `ImportError: Chinese requires: pypinyin`.
    "pypinyin>=0.50",
]

# CosyVoice 3 via the Apache-2.0 Rust+Candle wheel (`cosyvoice3.rs`).
# The wheel is NOT on PyPI — install it manually from GitHub Releases before
# activating this extra:
#   pip install "cosyvoice3 @ https://github.com/SpenserCai/cosyvoice3.rs/releases/download/v0.1.0/cosyvoice3-0.1.0%2Bmetal-cp310-abi3-macosx_11_0_arm64.whl"
# Other platforms (CUDA/CPU) need their own wheel — see project README
# at https://github.com/SpenserCai/cosyvoice3.rs/releases.
cosyvoice = [
    "numpy>=2.0",
]

# Piper TTS: MIT, ONNX, CPU-only (no PyTorch / no Metal). Fixed-speaker voices
# can't drift in accent and synth at ~0.03 RTF warm. ~15MB wheel + per-voice
# ONNX models fetched via `python -m piper.download_voices <name>`.
piper = [
    "piper-tts>=1.4",
    # Chinese voices (zh_CN-chaowen etc.) phonemize via g2pW pinyin — without
    # these the espeak-based huayan is the only zh voice that loads.
    "g2pw>=0.1.1",
    "sentence-stream>=1.3",
    "unicode-rbnf>=2.4",
]

# In-process raw-PCM playback (sounddevice → PortAudio → CoreAudio): kills the
# ~100-150ms ffplay spawn + SDL device-open per utterance and makes cancel an
# instant buffer discard instead of a SIGKILL. Kept optional so the core stays
# httpx+loguru+langdetect; without it streaming falls back to ffplay.
audio = [
    "sounddevice>=0.5",
]

# RAG-over-skills: bound CC/Codex startup context by surfacing skills per-turn
# via local embedding retrieval instead of listing every description at
# startup. fastembed runs the ONNX model on CPU (pulls onnxruntime + tokenizers
# + huggingface-hub); no PyTorch. The cross-lingual model (~0.22GB) downloads
# on first use into the configured cache_dir. Kept optional so TTS-only users
# pull none of it.
skills = [
    "fastembed>=0.8",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

# Install everything in one shot so `uv pip install -e '.[all]'` never
# silently drops one extra's deps while installing another's.
all = [
    "jarvis[xtts,cosyvoice,piper,audio,skills]",
]

[project.scripts]
jarvis = "jarvis.install:main"
jarvis-hook = "jarvis.hook_client:main"
jarvis-daemon = "jarvis.daemon.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
